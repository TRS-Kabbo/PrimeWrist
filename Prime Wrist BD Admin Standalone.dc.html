document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <sc-if value=\"{{ f.isText }}\"><x-import component-from-global-scope=\"PrimeWristBDDesignSystem_fd66a4.Input\" hint-size=\"100%,64px\" label=\"{{ f.label }}\" placeholder=\"{{ f.placeholder }}\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\"><\u002Fx-import><\u002Fsc-if>\n        <sc-if value=\"{{ f.isSelect }}\"><x-import component-from-global-scope=\"PrimeWristBDDesignSystem_fd66a4.Select\" hint-size=\"100%,64px\" label=\"{{ f.label }}\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" options=\"{{ f.options }}\"><\u002Fx-import><\u002Fsc-if>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <span style=\"font-family:var(--font-serif);font-size:var(--text-body-sm);color:var(--text-on-dark-faint);line-height:var(--leading-body);margin-top:calc(var(--space-5) * -1)\">All prices are stored in BDT — the fixed base currency. The storefront converts to USD on the fly using the exchange rate above; nothing is re-priced.<\u002Fspan>\n    <div style=\"border:1px solid var(--border-on-dark);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-5)\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <span style=\"font-size:var(--text-label-sm);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-on-dark)\">Announcement Bar<\u002Fspan>\n          <span style=\"font-family:var(--font-serif);font-size:var(--text-body-sm);color:var(--text-on-dark-muted)\">{{ bannerLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toggleBanner }}\" style=\"{{ bannerSwitch }}\"><span style=\"{{ bannerKnob }}\"><\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n      <sc-for list=\"{{ bannerFields }}\" as=\"f\" hint-placeholder-count=\"1\">\n        <x-import component-from-global-scope=\"PrimeWristBDDesignSystem_fd66a4.Input\" hint-size=\"100%,64px\" label=\"{{ f.label }}\" placeholder=\"{{ f.placeholder }}\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\"><\u002Fx-import>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--border-on-dark);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-5)\">\n      <span style=\"font-size:var(--text-label-sm);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-on-dark-muted)\">Search Engine Listing<\u002Fspan>\n      <sc-for list=\"{{ seoFields }}\" as=\"f\" hint-placeholder-count=\"2\">\n        <sc-if value=\"{{ f.isText }}\"><x-import component-from-global-scope=\"PrimeWristBDDesignSystem_fd66a4.Input\" hint-size=\"100%,64px\" label=\"{{ f.label }}\" placeholder=\"{{ f.placeholder }}\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\"><\u002Fx-import><\u002Fsc-if>\n        <sc-if value=\"{{ f.isArea }}\"><label style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:var(--text-label-sm);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-on-dark-muted)\">{{ f.label }}<\u002Fspan><textarea value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" rows=\"{{ f.rows }}\" placeholder=\"{{ f.placeholder }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;background:var(--surface-elevated);border:1px solid var(--border-on-dark);color:var(--text-on-dark);font-family:var(--font-serif);font-size:var(--text-body-md);line-height:var(--leading-body);padding:12px 14px;border-radius:var(--radius-sm)\"><\u002Ftextarea><\u002Flabel><\u002Fsc-if>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center;border-top:1px solid var(--border-on-dark);padding-top:var(--space-6)\">\n      <x-import component-from-global-scope=\"PrimeWristBDDesignSystem_fd66a4.Button\" hint-size=\"170px,44px\" sc-camel-on-click=\"{{ saveSettings }}\">Publish Changes<\u002Fx-import>\n      <sc-if value=\"{{ settingsSaved }}\"><span style=\"font-family:var(--font-serif);font-size:var(--text-body-md);color:var(--gold-300)\">Saved. Storefront updated.<\u002Fspan><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;orders&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Order[]&quot;},&quot;products&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Product[]&quot;},&quot;isMobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;codAdvanceThreshold&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:50000,&quot;min&quot;:0,&quot;max&quot;:300000,&quot;step&quot;:5000,&quot;unit&quot;:&quot;BDT&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;onOrderPatch&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id: string, patch: object) =&gt; void&quot;},&quot;onProductPatch&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id: string, patch: object) =&gt; void&quot;},&quot;onExit&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    session: null, role: 'Owner', email: '', pass: '', mfa: '', pendingRole: null, loginError: '',\n    view: 'reports', statusFilter: 'All', search: '', selectedId: null,\n    editingId: null, draftSaved: false, draft: null,\n    courierPick: {}, audit: [], codLog: {},\n    content: this.cmsSeed(), cmsPageId: null, cmsSaved: '', cmsDirty: false\n  };\n\n  fmt(n) { return 'BDT ' + new Intl.NumberFormat('en-US').format(Math.round(n)); }\n  now() { return new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }\n  orders() { return this.props.orders || []; }\n  products() { return this.props.products || []; }\n  patch(id, p) { if (this.props.onOrderPatch) this.props.onOrderPatch(id, p); }\n\n  toneFor(s) {\n    if (s === 'Delivered') return 'solid';\n    if (s === 'Cancelled' || s === 'Returned') return 'subtle';\n    return 'outline';\n  }\n\n  navFor(role) {\n    const all = [\n      { key: 'reports', label: 'Reports' },\n      { key: 'orders', label: 'Orders' },\n      { key: 'cod', label: 'COD Queue' },\n      { key: 'products', label: 'Products' },\n      { key: 'inventory', label: 'Inventory' }\n    ];\n    if (role === 'Fulfilment') return all.filter(n => n.key === 'orders' || n.key === 'cod');\n    if (role === 'Manager') return all.filter(n => n.key !== 'reports');\n    return all;\n  }\n\n  logAudit(text) {\n    const who = (this.state.session && this.state.session.name) || 'Admin';\n    this.setState(s => ({ audit: [{ at: this.now(), text, who }, ...s.audit].slice(0, 12) }));\n  }\n\n  advanceFor(o) {\n    const t = this.props.codAdvanceThreshold || 50000;\n    if (o.payment !== 'Cash on Delivery') return null;\n    if (o.total <= t) return 'No advance required';\n    return 'Advance ' + this.fmt(o.total * 0.2) + (o.advancePaid ? ' — received' : ' — outstanding');\n  }\n\n  cmsSeed() {\n    return {\n      home: {\n        heroEyebrow: 'A Journey Through Time, Perfected',\n        heroHeadline: 'Mechanical Timepieces, Examined And Judged Worthy',\n        heroSubhead: 'A considered collection of automatic, mechanical and quartz watches, held in Dhaka. Every piece is opened, wound and authenticated in-house before it is offered.',\n        heroPrimary: 'Explore The Collection',\n        heroSecondary: 'The Authenticity Guarantee',\n        heroImage: 'assets/hero-collection.jpg',\n        trust: [\n          { label: 'Authenticated In-House', note: 'Case opened, movement identified, timing measured over 24 hours.' },\n          { label: 'Papers Where They Exist', note: 'Box and certificate listed plainly; absent papers are stated, never implied.' },\n          { label: 'Insured Delivery', note: 'Hand-delivered in Dhaka, DHL Express and fully declared worldwide.' },\n          { label: '24 Months Of Cover', note: 'Mechanical warranty on every watch, serviced at our own bench.' }\n        ],\n        quote: 'Every mechanism we place on a wrist has been examined, wound, and judged worthy of a lifetime.',\n        houseBlurb: 'Prime Wrist BD trades in established watch houses from a single salon in Dhaka. Pieces are sourced, verified against manufacturer records, serviced where required, and offered with a written guarantee.',\n        salonHeading: 'Try It On Before You Decide',\n        salonBody: 'Any piece in the collection can be reserved for a private viewing. Bring your wrist; we will size the bracelet while you wait.'\n      },\n      brands: ['Patek Philippe', 'Audemars Piguet', 'Rolex', 'Omega', 'Cartier', 'Tissot'],\n      pages: [\n        { id: 'about', title: 'A Single Salon In Dhaka', eyebrow: 'The House', status: 'Published', lede: 'Prime Wrist BD began as a private collection and became a shop because friends kept asking to buy from it.', blocks: [\n          { heading: 'How We Buy', body: 'Every piece is bought outright, in person, from an owner or an established dealer. We do not broker watches we have not held.' },\n          { heading: 'What Happens Before A Listing', body: 'The case back comes off, the movement is identified, timing is measured over twenty-four hours, and water resistance is tested where the case allows.' },\n          { heading: 'Why The Collection Is Small', body: 'We hold what we would wear. A dozen pieces at a time, sometimes fewer.' }\n        ] },\n        { id: 'warranty', title: 'Warranty & Care', eyebrow: 'Aftercare', status: 'Published', lede: 'Twenty-four months of mechanical cover on every watch, and a workshop that answers the phone.', blocks: [\n          { heading: 'What Is Covered', body: 'Twenty-four months from the delivery date on the movement and its regulation.' },\n          { heading: 'What Is Not Covered', body: 'Water ingress after the gaskets have been di sContact';\n    v.isCmsSettings = st.view === 'cmsSettings';\n\n    // reports\n    if (v.isReports) {\n      const paid = orders.filter(o => o.status !== 'Cancelled');\n      const revenue = paid.reduce((a, o) => a + o.total, 0);\n      const cod = paid.filter(o => o.payment === 'Cash on Delivery');\n      const codRev = cod.reduce((a, o) => a + o.total, 0);\n      v.kpis = [\n        { label: 'Orders Today', value: String(orders.filter(o => o.today).length), note: 'Placed since 00:00 BST' },\n        { label: 'Revenue', value: this.fmt(revenue).replace('BDT ', '৳'), note: 'Net of cancellations' },\n        { label: 'Average Order', value: this.fmt(paid.length ? revenue / paid.length : 0).replace('BDT ', '৳'), note: 'Across ' + paid.length + ' orders' },\n        { label: 'Awaiting Call', value: String(codCount), note: 'COD orders not yet confirmed' }\n      ];\n      const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];\n      const series = [285000, 62000, 472000, 0, 610000, 927000, 385000];\n      const max = Math.max.apply(null, series);\n      v.chart = series.map((n, i) => ({\n        day: days[i], short: n ? Math.round(n / 1000) + 'k' : '—',\n        h: Math.max(2, Math.round((n / max) * 108)) + 'px',\n        fill: i === 5 ? 'var(--gold-500)' : 'var(--green-700)'\n      }));\n      const codPct = revenue ? Math.round((codRev / revenue) * 100) : 0;\n      v.split = { codPct: codPct + '%' };\n      v.splitRows = [\n        { label: 'Cash On Delivery', value: cod.length + ' orders — ' + codPct + '%' },\n        { label: 'Prepaid', value: (paid.length - cod.length) + ' orders — ' + (100 - codPct) + '%' }\n      ];\n      const tally = {};\n      orders.forEach(o => o.items.forEach(it => {\n        const k = it.name;\n        tally[k] = tally[k] || { units: 0, revenue: 0, name: it.name, brand: it.brand || '', image: it.image };\n        tally[k].units += it.qty; tally[k].revenue += it.price * it.qty;\n      }));\n      v.topProducts = Object.values(tally).sort((a, b) => b.revenue - a.revenue).slice(0, 4).map(t => ({\n        name: t.name, brand: t.brand, image: t.image,\n        units: t.units + (t.units === 1 ? ' unit' : ' units'), revenue: this.fmt(t.revenue)\n      }));\n    }\n\n    // orders list\n    if (v.isOrders) {\n      const q = st.search.trim().toLowerCase();\n      const rows = orders.filter(o => {\n        if (st.statusFilter !== 'All' && o.status !== st.statusFilter) return false;\n        if (!q) return true;\n        return (o.id + ' ' + o.customer + ' ' + o.phone).toLowerCase().includes(q);\n      });\n      v.statusFilters = ['All', 'Pending', 'Confirmed', 'Packed', 'Shipped', 'Delivered', 'Returned'].map(f => ({\n        label: f, active: st.statusFilter === f, onClick: () => this.setState({ statusFilter: f })\n      }));\n      v.search = st.search;\n      v.setSearch = e => this.setState({ search: e.target.value });\n      v.hasOrderRows = rows.length > 0;\n      v.noOrderRows = rows.length === 0;\n      v.orderRows = rows.map(o => ({\n        id: o.id, customer: o.customer, where: o.intl ? o.city + ', ' + o.country : o.city + ', Bangladesh',\n        payment: o.payment, total: this.fmt(o.total), status: o.status, tone: this.toneFor(o.status), date: o.date,\n        onClick: () => this.setState({ view: 'orderDetail', selectedId: o.id }),\n        rowStyle: {\n          display: 'flex', flexWrap: 'wrap', gap: 'var(--space-5)', alignItems: 'center',\n          justifyContent: 'space-between', padding: '18px 0', borderBottom: '1px solid var(--border-on-dark)', cursor: 'pointer'\n        }\n      }));\n    }\n\n    // order detail\n    if (v.isOrderDetail) {\n      const o = orders.find(x => x.id === st.selectedId);\n      if (o) {\n        const flow = ['Pending', 'Confirmed', 'Packed', 'Shipped', 'Delivered'];\n        const idx = flow.indexOf(o.status);\n        const actions = [];\n        if (idx >= 0 && idx < flow.length - 1) {\n          const next = flow[idx + 1];\n          const blocked = next === 'Shipped' && o.payment === 'Cash on Delivery' && o.codCall !== 'Confirmed';\n          actions.push({\n            label: blocked ? 'Call To Confirm First' : 'Mark ' + next, variant: 'primary',\n            onClick: blocked\n              ? () => this.setState({ view: 'cod' })\n              : () => { this.patch(o.id, { status: next, consignment: next === 'Shipped' ? (o.consignment || this.consign(o)) : o.consignment }); this.logAudit(o.id + ' moved to ' + next); }\n          });\n        }\n        if (o.status === 'Delivered' && !o.returnRequested) {\n          actions.push({ label: 'Log Return Request', variant: 'secondary', onClick: () => this.patch(o.id, { returnRequested: true, returnReason: 'Buyer reports the bracelet sits loose; requests exchange for a 39mm case.' }) });\n        }\n        if (idx >= 0 && idx < 3) actions.push({ label: 'Cancel Order', variant: 'secondary', onClick: () => { this.patch(o.id, { status: 'Cancelled' }); this.logAudit(o.id + ' cancelled'); } });\n\n        const ship = o.shipping || 0;\n        const vat = Math.round(o.total * 0.075 / 1.075);\n        v.detail = {\n          id: o.id, status: o.status, tone: this.toneFor(o.status), placedLabel: 'Placed ' + o.date + ' — ' + o.payment,\n          actions,\n          items: o.items.map(it => ({ name: it.name, meta: (it.brand || '') + ' — Qty ' + it.qty + (it.strap ? ' — ' + it.strap : ''), line: this.fmt(it.price * it.qty) })),\n          totals: [\n            { label: 'Shipping', value: ship ? this.fmt(ship) : 'Free', labelStyle: this.lbl(), valueStyle: this.val() },\n            { label: 'VAT 7.5% included', value: this.fmt(vat), labelStyle: this.lbl(), valueStyle: this.val() },\n            { label: 'Total', value: this.fmt(o.total), labelStyle: this.lbl(true), valueStyle: this.val(true) }\n          ],\n          customerRows: [\n            { label: 'Name', value: o.customer },\n            { label: 'Phone', value: o.phone },\n            { label: 'Email', value: o.email || 'Guest checkout' },\n            { label: 'Account', value: o.guest ? 'Guest' : 'Registered' },\n            { label: 'Address', value: o.address }\n          ],\n          notifications: o.notifications || [],\n          shipTitle: o.intl ? 'International Fulfilment' : 'Domestic Fulfilment',\n          shipRows: o.intl\n            ? [\n              { label: 'Carrier', value: o.courier || 'DHL Express' },\n              { label: 'Zone', value: o.zone || 'Zone C — Europe & North America' },\n              { label: 'HS Code', value: '9101.21.00 — wrist-watches, automatic' },\n              { label: 'Commercial Invoice', value: o.consignment ? 'Generated' : 'Pending booking' }\n            ]\n            : [\n              { label: 'Courier', value: o.courier || (st.courierPick[o.id] || 'Not booked') },\n              { label: 'Consignment', value: o.consignment || '—' },\n              { label: 'Zone', value: o.city === 'Dhaka' ? 'Inside Dhaka — 1–2 days' : 'Outside Dhaka — 3–5 days' }\n            ],\n          needsCourier: !o.consignment && (o.status === 'Packed' || o.status === 'Confirmed'),\n          courierHint: o.intl ? 'Book with DHL and generate the commercial invoice and HS-code declaration.' : 'Create a consignment with a domestic courier. Status syncs back from their API.',\n          couriers: (o.intl ? ['DHL Express', 'FedEx'] : ['Pathao', 'Steadfast', 'RedX']).map(c => ({\n            label: c, active: (st.courierPick[o.id] || o.courier) === c,\n            onClick: () => this.setState(s => ({ courierPick: Object.assign({}, s.courierPick, { [o.id]: c }) }))\n          })),\n          bookLabel: o.intl ? 'Book Shipment And Generate Invoice' : 'Create Consignment',\n          book: () => {\n            const c = st.courierPick[o.id] || (o.intl ? 'DHL Express' : 'Pathao');\n            const cn = this.consign(o);\n            this.patch(o.id, { courier: c, consignment: cn });\n            this.logAudit(o.id + ' booked with ' + c + ' — ' + cn);\n          },\n          hasConsignment: !!o.consignment,\n          printLabel: () => window.print(),\n          returnRequested: !!o.returnRequested,\n          returnReason: o.returnReason || '',\n          approveReturn: () => { this.patch(o.id, { status: 'Returned', returnRequested: false }); this.logAudit(o.id + ' return approved, refund issued'); },\n          declineReturn: () => this.patch(o.id, { returnRequested: false }),\n          refundRoute: o.payment === 'Cash on Delivery'\n            ? 'COD refunds are paid out by bKash send-money to the buyer\\u2019s number, logged against this order.'\n            : 'Refund is issued to the original ' + o.payment + ' transaction and reconciled in the daily settlement report.'\n        };\n      }\n      v.backToOrders = () => this.setState({ view: 'orders', selectedId: null });\n    }\n\n    // COD queue\n    if (v.isCod) {\n      const queue = orders.filter(o => o.payment === 'Cash on Delivery' && !o.codCall);\n      v.hasCodQueue = queue.length > 0;\n      v.noCodQueue = queue.length === 0;\n      v.codQueue = queue.map(o => ({\n        id: o.id, customer: o.customer, phone: o.phone, where: o.city, total: this.fmt(o.total),\n        advance: this.advanceFor(o) || '',\n        history: o.refusals ? o.refusals + ' previous refusal(s) on this number — confirm carefully before release.' : 'No previous refusals on this number.',\n        outcomes: [\n          { label: 'Confirmed', variant: 'primary', onClick: () => { this.patch(o.id, { codCall: 'Confirmed', status: o.status === 'Pending' ? 'Confirmed' : o.status }); this.logAudit(o.id + ' COD call: confirmed'); } },\n          { label: 'No Answer', variant: 'secondary', onClick: () => { this.patch(o.id, { codCall: 'No answer' }); this.logAudit(o.id + ' COD call: no answer, retry scheduled'); } },\n          { label: 'Refused', variant: 'secondary', onClick: () => { this.patch(o.id, { codCall: 'Refused', status: 'Cancelled', refusals: (o.refusals || 0) + 1 }); this.logAudit(o.id + ' COD call: refused, order cancelled'); } }\n        ]\n      }));\n    }\n\n    // products\n    if (v.isProducts) {\n      v.newProduct = () => this.setState({ view: 'productEdit', editingId: 'new', draftSaved: false, draft: { name: '', brand: '', price: '', compare: '', stock: '', sku: '', diameter: '', warranty: '24 months', movement: 'Automatic' } });\n      v.productRows = products.map(p => ({\n        image: p.image, brand: p.brand, name: p.name, sku: p.sku, price: this.fmt(p.price),\n        stockLabel: p.archived ? 'Archived' : (p.stock > 0 ? p.stock + ' in stock' : 'Out of stock'),\n        stockStyle: {\n          fontFamily: 'var(--font-sans)', fontSize: 'var(--text-label-sm)', letterSpacing: 'var(--tracking-label)',\n          textTransform: 'uppercase', flex: '0 0 auto', minWidth: '104px',\n          color: p.archived ? 'var(--text-on-dark-faint)' : (p.stock > 0 ? 'var(--gold-300)' : 'var(--text-on-dark-faint)')\n        },\n        onEdit: () => this.setState({ view: 'productEdit', editingId: p.id, draftSaved: false, draft: { name: p.name, brand: p.brand, price: String(p.price), compare: p.originalPrice ? String(p.originalPrice) : '', stock: String(p.stock), sku: p.sku, diameter: p.specs.diameter, warranty: p.specs.warranty, movement: p.movement } }),\n        archiveLabel: p.archived ? 'Restore' : 'Archive',\n        onArchive: () => { if (this.props.onProductPatch) this.props.onProductPatch(p.id, { archived: !p.archived }); this.logAudit(p.name + (p.archived ? ' restored' : ' archived')); }\n      }));\n    }\n\n    if (v.isProductEdit) {\n      const d = st.draft || {};\n      const set = k => e => this.setState(s => ({ draft: Object.assign({}, s.draft, { [k]: e.target.value }), draftSaved: false, draftError: '' }));\n      const setNum = k => e => this.setState(s => ({ draft: Object.assign({}, s.draft, { [k]: e.target.value.replace(/[^0-9]/g, '') }), draftSaved: false, draftError: '' }));\n      const src = (products.find(p => p.id === st.editingId) || {}).image || 'assets/collection-case.jpg';\n      v.movementOptions = ['Automatic', 'Mechanical', 'Quartz', 'Solar'];\n      v.draft = {\n        eyebrow: st.editingId === 'new' ? 'New Listing' : 'Editing — ' + (d.brand || ''),\n        heading: st.editingId === 'new' ? 'Add Product' : (d.name || 'Product'),\n        movement: d.movement, setMovement: e => this.setState(s => ({ draft: Object.assign({}, s.draft, { movement: e.target.value }) })),\n        fields: [\n          { label: 'Product Name', placeholder: 'Nautilus Automatic', value: d.name || '', onChange: set('name') },\n          { label: 'Brand', placeholder: 'Patek Philippe', value: d.brand || '', onChange: set('brand') },\n          { label: 'Price BDT', placeholder: '385000', value: d.price || '', onChange: setNum('price') },\n          { label: 'Compare-At Price', placeholder: 'Optional', value: d.compare || '', onChange: setNum('compare') },\n          { label: 'Stock', placeholder: '2', value: d.stock || '', onChange: setNum('stock') },\n          { label: 'SKU', placeholder: 'PWBD-PP-5711', value: d.sku || '', onChange: set('sku') },\n          { label: 'Case Diameter', placeholder: '40 mm', value: d.diameter || '', onChange: set('diameter') },\n          { label: 'Warranty Term', placeholder: '24 months', value: d.warranty || '', onChange: set('warranty') }\n        ],\n        media: [\n          { src, label: 'Primary', opacity: 1 },\n          { src, label: 'Dial', opacity: 0.85 },\n          { src, label: 'Profile', opacity: 0.7 }\n        ],\n        saved: st.draftSaved,\n        error: st.draftError || '',\n        save: () => {\n          const bad = [];\n          if (!(d.name || '').trim()) bad.push('name');\n          if (!(d.brand || '').trim()) bad.push('brand');\n          if (!d.price || Number(d.price) <= 0) bad.push('price');\n          if (d.stock === '' || d.stock == null) bad.push('stock');\n          if (bad.length) { this.setState({ draftError: 'A product name and brand are required; price must be a number above zero and stock a whole number.' }); return; }\n          if (this.props.onProductPatch && st.editingId !== 'new') {\n            this.props.onProductPatch(st.editingId, {\n              name: d.name, brand: d.brand, price: Number(d.price) || 0,\n              originalPrice: d.compare ? Number(d.compare) : null, stock: Number(d.stock) || 0, movement: d.movement\n            });\n          }\n          this.setState({ draftSaved: true, draftError: '' });\n          this.logAudit((d.name || 'Product') + ' saved from the product editor');\n        }\n      };\n      v.backToProducts = () => this.setState({ view: 'products', editingId: null, draftSaved: false });\n    }\n\n    if (v.isInventory) {\n      v.stockRows = products.map(p => ({\n        name: p.name, sku: p.sku, stock: String(p.stock),\n        inc: () => { if (this.props.onProductPatch) this.props.onProductPatch(p.id, { stock: p.stock + 1 }); this.logAudit(p.name + ' stock ' + p.stock + ' → ' + (p.stock + 1)); },\n        dec: () => { if (p.stock > 0) { if (this.props.onProductPatch) this.props.onProductPatch(p.id, { stock: p.stock - 1 }); this.logAudit(p.name + ' stock ' + p.stock + ' → ' + (p.stock - 1)); } }\n      }));\n      v.audit = st.audit;\n      v.hasAudit = st.audit.length > 0;\n      v.noAudit = st.audit.length === 0;\n    }\n\n    this.cmsVals(v);\n    return v;\n  }\n\n  lbl(strong) {\n    return {\n      fontFamily: 'var(--font-sans)', fontSize: 'var(--text-label-sm)', letterSpacing: 'var(--tracking-label)',\n      textTransform: 'uppercase', color: strong ? 'var(--text-on-dark)' : 'var(--text-on-dark-faint)'\n    };\n  }\n  val(strong) {\n    return { fontFamily: 'var(--font-serif)', fontSize: strong ? 'var(--text-body-xl)' : 'var(--text-body-md)', color: strong ? 'var(--text-on-dark)' : 'var(--text-on-dark-muted)' };\n  }\n  consign(o) { return (o.intl ? 'DHL-' : 'CN-') + Math.floor(100000 + Math.random() * 899999); }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
